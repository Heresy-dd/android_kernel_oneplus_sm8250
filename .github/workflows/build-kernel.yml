name: Build Kernel

on:
  push:
    branches:
      - droidspaces-rwprocmem
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Setup Clang
      run: |
        mkdir -p ~/toolchains
        cd ~/toolchains
        git clone --depth=1 https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone.git clang

    - name: Build kernel
      run: |
        export PATH=~/toolchains/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        make O=out ARCH=arm64 vendor/kona_defconfig droidspaces.config
        scripts/config --file out/.config -e CONFIG_NAMESPACES -e CONFIG_PID_NS -e CONFIG_UTS_NS -e CONFIG_IPC_NS -e CONFIG_NET_NS -e CONFIG_CGROUPS -e CONFIG_CGROUP_DEVICE -e CONFIG_MEMCG -e CONFIG_OVERLAY_FS -e CONFIG_VETH -e CONFIG_BRIDGE -e CONFIG_NETFILTER -e CONFIG_RWPROCMEM33 -e CONFIG_HWBREAKPOINT_PROC
        make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc --all)

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: |
          out/arch/arm64/boot/Image*
          out/arch/arm64/boot/dts/vendor/qcom/*.dtb
